  name: Update satellite data
  on:
    schedule:
      - cron: '0 1 * * *'
    workflow_dispatch: {}
  permissions:
    contents: write
  jobs:
    update:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
        - name: Download latest data
          run: |
            mkdir -p seed
            for g in visual stations; do
              curl -fsSL --retry 3 --retry-delay 5 --max-time 60 \
                "https://celestrak.org/NORAD/elements/gp.php?GROUP=$g&FORMAT=tle" -o "seed/$g.tle.new" || true
              if grep -q '^1 ' "seed/$g.tle.new" 2>/dev/null; then
                mv "seed/$g.tle.new" "seed/$g.tle"
              else
                rm -f "seed/$g.tle.new"; echo "no valid data for $g"
              fi
            done
        - name: Save changes
          run: |
            git config user.name "tle-bot"
            git config user.email "tle-bot@users.noreply.github.com"
            git add seed
            if ! git diff --cached --quiet; then
              git commit -m "Update satellite data [skip render]"
              git push
            fi
